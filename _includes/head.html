  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZ52T6X54Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XZ52T6X54Q');
  </script>

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">

  <!-- Canonical is derived from the page permalink, so it can never point at a URL that does not exist. -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:site_name" content="RK Consulting">
  <meta property="og:locale" content="en_NZ">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.og_title | default: page.title }}">
  <meta property="og:description" content="{{ page.og_description | default: page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.og_image | default: '/images/og-default.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="RK Consulting — Auckland data, analytics and AI consultancy">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.og_title | default: page.title }}">
  <meta name="twitter:description" content="{{ page.og_description | default: page.description }}">
  <meta name="twitter:image" content="{{ page.og_image | default: '/images/og-default.jpg' | absolute_url }}">

{% if site.noindex %}  <meta name="robots" content="noindex, nofollow">
{% else %}  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
{% endif %}  <meta name="author" content="Rahul Khatri">
