{%- assign page_url = page.url | absolute_url -%}
  <!-- Page-level graph: this page, its breadcrumb, and (on service pages) the service it describes. Driven by front matter. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "{{ page.schema_type | default: 'WebPage' }}",
        "@id": "{{ page_url }}#webpage",
        "url": "{{ page_url }}",
        "name": {{ page.title | jsonify }},
        "description": {{ page.description | jsonify }},
        "inLanguage": "en-NZ",
        "isPartOf": { "@id": "https://www.rkconsulting.co.nz/#website" },
        "about": { "@id": "https://www.rkconsulting.co.nz/#organization" }{% if page.last_modified_at %},
        "dateModified": "{{ page.last_modified_at | date: '%Y-%m-%d' }}"{% endif %}{% if page.service %},
        "mainEntity": { "@id": "{{ page_url }}#service" }{% elsif page.schema_main_entity %},
        "mainEntity": { "@id": "{{ page.schema_main_entity }}" }{% endif %}{% if page.url != "/" %},
        "breadcrumb": { "@id": "{{ page_url }}#breadcrumb" }{% endif %}
      }{% if page.url != "/" %},
      {
        "@type": "BreadcrumbList",
        "@id": "{{ page_url }}#breadcrumb",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.rkconsulting.co.nz/" },
          { "@type": "ListItem", "position": 2, "name": {{ page.breadcrumb | default: page.title | jsonify }}, "item": "{{ page_url }}" }
        ]
      }{% endif %}{% if page.service %},
      {
        "@type": "Service",
        "@id": "{{ page_url }}#service",
        "name": {{ page.service.name | jsonify }},
        "serviceType": {{ page.service.type | jsonify }},
        "description": {{ page.service.description | jsonify }},
        "url": "{{ page_url }}",
        "provider": { "@id": "https://www.rkconsulting.co.nz/#organization" },
        "areaServed": [
          { "@type": "City", "name": "Auckland" },
          { "@type": "Country", "name": "New Zealand" },
          { "@type": "Country", "name": "Australia" },
          { "@type": "Place", "name": "Pacific Islands" }
        ],
        "audience": { "@type": "BusinessAudience", "audienceType": "Small and medium-sized businesses and public-sector organisations" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": {{ page.service.name | append: " services" | jsonify }},
          "itemListElement": [{% for o in page.service.offers %}
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": {{ o | jsonify }} } }{% unless forloop.last %},{% endunless %}{% endfor %}
          ]
        }
      }{% endif %}
    ]
  }
  </script>
