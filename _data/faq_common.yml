# Added to the end of every service page's FAQ list.
- q: How does a project with RK Consulting start?
  a: Every project starts with a free, no-obligation conversation about your challenge and goals. We then send a clear, scoped proposal with deliverables and timelines before any work begins.
- q: Do you work with clients outside Auckland?
  a: Yes. RK Consulting is based in Auckland and works with organisations across New Zealand, Australia and the Pacific, on-site in Auckland or remotely.
